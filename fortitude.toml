[check]
preview = false
select = ["C", "S"]
ignore = [
  "superfluous-implicit-none",
  "implicit-external-procedures",
  "interface-implicit-typing",
  "bad-quote-string",
  "trailing-backslash",
  "magic-number-in-array-size",
  "mixed-scalar-array-declaration",
]
file-extensions = ["f90", "F90"]
line-length = 78
fix = true
