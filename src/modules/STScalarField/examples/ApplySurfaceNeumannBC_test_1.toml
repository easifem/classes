# Input file for ApplySurfaceNeumannBC_test_1 (STScalarField_).
# square_3x2.h5: square [0, 10] x [0, 10], two Quadrangle4 elements,
# six nodes 1 (0,0), 2 (10,0), 3 (10,10), 4 (0,10), 5 (5,0), 6 (5,10).
# Space: order 1 Lagrange, six DOFs. Time: order 1 Lagrange, two DOFs
# (timeCompo = 2). The field has 6 * 2 = 12 values.

[domain]
filename = "./meshdata/square_3x2.h5"
totalMedium = 1

[u]
name = "u"
engine = "NATIVE_SERIAL"
fieldType = "Normal"
fedofName = "space"
geofedofName = "geofedof"
timefedofName = "time"

[u.geofedof]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"

[u.space]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"
order = 1
scaleForQuadOrder = 2
quadOptName = "quadOpt"

[u.space.quadOpt]
isHomogeneous = true
quadratureType = "GaussLegendre"

[u.time]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"
order = 1
scaleForQuadOrder = 2
quadOptName = "quadOpt"

[u.time.quadOpt]
quadratureType = "GaussLegendre"

# Surface Neumann BCs of u (constant in space and time):
#   right : q = 2 on line 2 (nodes 2, 3)
#   bottom: q = 5 on line 1 (nodes 1, 5, 2); node 2 is shared

[[u.neumannBC]]
name = "right"
idof = 1
nodalValueType = "Constant"
value = 2.0
[u.neumannBC.boundary]
isSelectionByMeshID = true
[u.neumannBC.boundary.meshID]
line = [2]

[[u.neumannBC]]
name = "bottom"
idof = 1
nodalValueType = "Constant"
value = 5.0
[u.neumannBC.boundary]
isSelectionByMeshID = true
[u.neumannBC.boundary.meshID]
line = [1]
