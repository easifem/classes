# Common input file for the VectorField_ tests.
# square_3x2.h5: square [0, 10] x [0, 10], two Quadrangle4 elements,
# six nodes. With order 1 Lagrange and two space components the field has
# 6 x 2 = 12 values.

[domain]
filename = "./meshdata/square_3x2.h5"
totalMedium = 1

[u]
name = "u"
engine = "NATIVE_SERIAL"
fieldType = "Normal"
spaceCompo = 2
timeCompo = 1
fedofName = "space"
geofedofName = "geofedof"

[u.geofedof]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"

[u.space]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"
order = 1
scaleForQuadOrder = 2
quadOptName = "quadOpt"

[u.space.quadOpt]
isHomogeneous = true
quadratureType = "GaussLegendre"
