# Input file for MatrixField Initiate_test_4.
# square_3x2.h5: square [0, 10] x [0, 10], two Quadrangle4 elements
# {1, 5, 6, 4} and {5, 2, 3, 6}, six nodes.
# u1 (rows): scalar field, order 1 Lagrange, broken space, 8 DOFs.
# u2 (columns): scalar field, order 1 Lagrange, 6 DOFs -> 8 x 6 matrix.

[domain]
filename = "./meshdata/square_3x2.h5"
totalMedium = 1

[u1]
name = "u"
engine = "NATIVE_SERIAL"
fieldType = "Normal"
spaceCompo = 1
timeCompo = 1
fedofName = "space"
geofedofName = "geofedof"

[u1.geofedof]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
brokenSpace = false
ipType = "Equidistance"
basisType = "Monomial"

[u1.space]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
brokenSpace = true
ipType = "Equidistance"
basisType = "Monomial"
order = 1
scaleForQuadOrder = 2
quadOptName = "quadOpt"

[u1.space.quadOpt]
isHomogeneous = true
quadratureType = "GaussLegendre"

[u2]
name = "u"
engine = "NATIVE_SERIAL"
fieldType = "Normal"
spaceCompo = 1
timeCompo = 1
fedofName = "space"
geofedofName = "geofedof"

[u2.geofedof]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
brokenSpace = false
ipType = "Equidistance"
basisType = "Monomial"

[u2.space]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
brokenSpace = false
ipType = "Equidistance"
basisType = "Monomial"
order = 1
scaleForQuadOrder = 2
quadOptName = "quadOpt"

[u2.space.quadOpt]
isHomogeneous = true
quadratureType = "GaussLegendre"
