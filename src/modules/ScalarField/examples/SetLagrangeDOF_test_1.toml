# Input file for SetLagrangeDOF_test_1.
# square_3x2.h5: square [0, 10] x [0, 10], two Quadrangle4 elements.
# u: order 1 Lagrange (source field, six DOFs)
# w: order 2 Lagrange (target field, 15 DOFs)

[domain]
filename = "./meshdata/square_3x2.h5"
totalMedium = 1

[u]
name = "u"
engine = "NATIVE_SERIAL"
fieldType = "Normal"
spaceCompo = 1
timeCompo = 1
fedofName = "space"
geofedofName = "geofedof"

[u.geofedof]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"

[u.space]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"
order = 1
scaleForQuadOrder = 2
quadOptName = "quadOpt"

[u.space.quadOpt]
isHomogeneous = true
quadratureType = "GaussLegendre"

[w]
name = "w"
engine = "NATIVE_SERIAL"
fieldType = "Normal"
spaceCompo = 1
timeCompo = 1
fedofName = "space"
geofedofName = "geofedof"

[w.geofedof]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"

[w.space]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"
order = 2
scaleForQuadOrder = 2
quadOptName = "quadOpt"

[w.space.quadOpt]
isHomogeneous = true
quadratureType = "GaussLegendre"
