# Common input file for the VtkHDF5File tests which need FEDOF.

[domain]
filename = "./meshdata/small_tri3_mesh.h5"
totalMedium = 1

[u]
name = "u"
engine = "NATIVE_SERIAL"
fieldType = "Normal"
spaceCompo = 1
timeCompo = 1
fedofName = "space"
geofedofName = "geofedof"

[u.geofedof]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"

[u.space]
baseContinuity = "H1"
baseInterpolation = "Lagrange"
ipType = "Equidistance"
baseType = "Monomial"
order = 3
scaleForQuadOrder = 2
quadOptName = "quadOpt"

[u.space.quadOpt]
isHomogeneous = true
quadratureType = "GaussLegendre"

[ScalarFunc]
name = "scalarfunc"
returnType = "Scalar"
argType = "Space"
numArgs = 4
luaScript = "ExportToVtkHDF5File_test_1.lua"
luaFunctionName = "ScalarFunc1"
