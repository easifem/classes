        font-size="10.5" font-weight="600" letter-spacing="1.4">BUILDS ON</text>

  <!-- Lower: easifemBase -->
  <rect x="200" y="400" width="560" height="84" rx="16"
        fill="#3C3836" stroke="#665C54" stroke-width="1.5"/>
  <text x="480" y="436" text-anchor="middle" fill="#FBF1C7"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif"
