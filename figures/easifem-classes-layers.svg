        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="2.2">
    APPLICATIONS AND PHYSICS KERNELS
  </text>

  <rect x="278" y="64" width="100" height="34" rx="17"
        fill="#3C3836" stroke="#665C54"/>
  <text x="328" y="86" text-anchor="middle" fill="#EBDBB2"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="13.5" font-weight="500">Elasticity</text>

  <rect x="390" y="64" width="80" height="34" rx="17"
        fill="#3C3836" stroke="#665C54"/>
  <text x="430" y="86" text-anchor="middle" fill="#EBDBB2"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif"
        font-size="13.5" font-weight="500">Seepage</text>

  <rect x="482" y="64" width="94" height="34" rx="17"
