<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640"
     viewBox="0 0 960 640" role="img"
     aria-labelledby="title desc">
  <title id="title">Where easifemClasses fits in EASIFEM</title>
  <desc id="desc">
    Applications and physics kernels such as elasticity, seepage and
    diffusion build on easifemClasses. easifemClasses builds on
    easifemBase. easifemBase wraps BLAS, LAPACK, HDF5, TOML-F, Sparsekit
    and METIS.
  </desc>

  <defs>
    <!-- gruvbox-dark card and warm accent gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32302F"/>
      <stop offset="1" stop-color="#1D2021"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D65D0E"/>
      <stop offset="0.5" stop-color="#FE8019"/>
      <stop offset="1" stop-color="#FABD2F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FE8019" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FE8019" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8EC07C"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="638" rx="24"
        fill="url(#bg)" stroke="#3C3836" stroke-width="2"/>
  <ellipse cx="480" cy="250" rx="440" ry="230" fill="url(#glow)"/>

  <!-- Top: applications and kernels -->
